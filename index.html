      gradient-header + four KPI cards + shadowed-card grid.

      seven transparent pigment washes (ultramarine, cerulean, burnt sienna, alizarin, violet, viridian,

      no shadows, no glass. Type: Noto Sans Hebrew (user-pinned) throughout, headings at weight 500,
      tabular numerals.

      expense in two taps.

      pencil timeline and a wash dot per activity; bottom tab bar; floating "הוצאה" add button.
      FORM: IMPECCABLE'S PICK "watercolor sketchbook" (user-chosen over assigned #4), seed e193f959.
